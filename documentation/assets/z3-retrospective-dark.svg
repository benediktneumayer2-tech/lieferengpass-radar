<svg xmlns="http://www.w3.org/2000/svg" width="820" height="432" viewBox="0 0 820 432" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Retrospective 2026: hits among the 50 top-ranked active substances</title>
<desc id="d">Share of the 50 active substances with the highest estimate per reference date that received a new BASG shortage report within 8 weeks. Z3 v0 20.2% (AUC 0.819); without foreign data 19.2% (AUC 0.810); tier rule by number of reporting countries 13.8% (AUC 0.728); only past shortages in Austria 7.2% (AUC 0.733); random selection 3.0% (AUC 0.5). Trained 2024–2025, tested 2026, 23,461 cases, 714 reports. Retrospective, not a prospective test. Source: reports/Z3 v0 Prüfbericht.md.</desc>
